<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Last Bell Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: the 3D world fills the screen. Fight-poster HUD floats over it: status top-left, prompts and dialogue bottom-centre, ring controls bottom-right. */
:root{
  color-scheme:dark;
  --ring:#1d1626; --canvas:#2a2035; --rope:#3b2e49; --line:#54436a;
  --chalk:#f4ebdc; --dust:#b9a9c4; --bell:#f2b233; --glove:#ee5a4b; --mint:#46c2a8;
  --display:"Bowlby One","Impact","Arial Black",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 12px); --gb:calc(env(safe-area-inset-bottom,0px) + 16px);
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--ring);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--bell);outline-offset:2px}
.glass{background:rgba(29,22,38,.86);border-radius:6px}

#top{position:fixed;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#status{padding:8px 12px;min-width:0;max-width:440px}
.wk{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:18px;text-transform:uppercase}
.wk em{font-style:normal;color:var(--bell)}
.pips{display:flex;gap:4px}.pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--bell)}.pip.on{background:var(--bell)}
#obj{font-size:14px;color:var(--dust);margin-top:2px}
#chips{font-family:var(--num);font-weight:600;font-size:15px;letter-spacing:.05em;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
#chips b{color:var(--bell)}
.tb{pointer-events:auto;border:0;padding:8px 12px;font-family:var(--num);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--gb) + 8px);max-width:calc(100% - 32px);
  font-family:var(--display);font-size:17px;text-transform:uppercase;background:var(--bell);color:#241a08;border:0;border-radius:4px;padding:12px 18px}
#prompt kbd{font-family:var(--num);font-weight:700;background:#241a08;color:var(--bell);border-radius:3px;padding:1px 6px;margin-right:8px}
#timer{position:fixed;top:calc(var(--gt) + 110px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:26px;padding:6px 16px;font-variant-numeric:tabular-nums}

.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--gb);width:min(560px,calc(100% - 32px));padding:16px 18px;max-height:70%;overflow:auto}
.sheet{touch-action:pan-y;overscroll-behavior:contain;background:rgba(29,22,38,.97);z-index:3}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rope)}
.item>div{min-width:0}.item .d{color:var(--dust);font-size:14px}.item button{flex:none}
.own{font-family:var(--num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mint)}
button:disabled{opacity:.5;cursor:not-allowed}
.sheet .who{font-family:var(--num);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bell);font-size:15px}
.sheet .big{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1.05;margin:2px 0 6px}
.sheet p{margin:6px 0}
.sheet .gain{color:var(--mint);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cta{font-family:var(--display);font-size:16px;text-transform:uppercase;background:var(--bell);color:#241a08;border:0;border-radius:4px;padding:10px 16px}
.ghost{background:none;border:2px solid var(--line);border-radius:4px;padding:8px 14px;font-weight:600}
.bar{position:relative;height:50px;background:var(--rope);border-radius:4px;overflow:hidden;margin:12px 0}
.zone{position:absolute;top:0;bottom:0;background:#6a5420}.zone.p{background:var(--bell)}
.mark{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--chalk);border-radius:3px;box-shadow:0 0 0 2px var(--ring)}

#fhud{position:fixed;inset:0;pointer-events:none}
#bossbox{position:absolute;top:var(--gt);left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));padding:8px 12px}
#bossbox .nm{display:flex;justify-content:space-between;gap:8px;font-family:var(--num);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px}
#bossbox .nm span:last-child{color:var(--bell)}
.hp{position:relative;height:16px;background:var(--rope);border-radius:3px;overflow:hidden;margin-top:4px}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--glove)}
.hp.me i{background:var(--mint)}.hp.st i{background:var(--bell)}.hp.st{height:8px}
#tell{margin-top:6px;font-family:var(--display);font-size:17px;text-transform:uppercase;min-height:1.3em;text-align:center}
#tell.block{color:var(--bell)}#tell.slip{color:var(--glove)}#tell.open{color:var(--mint)}
#mebox{position:absolute;left:var(--gl);bottom:calc(var(--gb) + 150px);width:min(220px,46%);padding:8px 10px;font-family:var(--num);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
#pads{position:absolute;right:var(--gr);bottom:var(--gb);display:grid;grid-template-columns:repeat(2,minmax(0,84px));gap:8px;pointer-events:auto}
.pad{height:68px;border:0;border-bottom:4px solid var(--line);border-radius:8px;background:rgba(59,46,73,.92);font-family:var(--display);font-size:15px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.pad small{font-family:var(--num);font-weight:600;color:var(--bell);font-size:12px;letter-spacing:.08em}
.pad.on,.pad:active{background:var(--bell);color:#241a08}.pad.on small,.pad:active small{color:#241a08}
.pop{position:fixed;font-family:var(--display);font-size:26px;pointer-events:none;color:var(--glove);text-shadow:0 2px 0 #000;animation:pop .9s ease-out forwards;transform:translate(-50%,0)}
.pop.crit{color:var(--bell);font-size:34px}.pop.good{color:var(--mint);font-size:20px}.pop.me{color:#ff9b8f}
@keyframes pop{from{margin-top:0;opacity:1}to{margin-top:-50px;opacity:0}}
#swing{position:fixed;right:var(--gr);bottom:var(--gb);width:84px}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px var(--glove);opacity:0}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(244,235,220,.5);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(244,235,220,.7)}
#fade{position:fixed;inset:0;background:#0b0910;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--display);font-size:clamp(22px,6vw,40px);text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>

<canvas id="c"></canvas>
<div id="top">
  <div id="status" class="glass"><div class="wk"><span>Last <em>Bell</em></span><span id="week"></span></div><div id="obj"></div><div id="chips"></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button id="shopb" class="glass tb">Shop</button><button id="tp" class="glass tb">Teleport</button><button id="menu" class="glass tb">Menu</button></div>
</div>
<button id="prompt" hidden></button>
<div id="timer" class="glass" hidden></div>
<div id="fhud" hidden>
  <div id="bossbox" class="glass"><div class="nm"><span id="bname"></span><span id="btag"></span></div><div class="hp"><i id="bhp"></i></div><div id="tell"></div></div>
  <div id="mebox" class="glass">You<div class="hp me"><i id="php"></i></div><div class="hp st"><i id="pst"></i></div></div>
  <div id="pads">
    <button class="pad" data-p="jab" id="pad-jab">Slash<small>J</small></button>
    <button class="pad" data-p="power" id="pad-power">Heavy<small>K</small></button>
    <button class="pad" data-p="block" id="pad-block">Block<small>Hold L</small></button>
    <button class="pad" data-p="slip" id="pad-slip">Dodge<small>Space</small></button>
  </div>
</div>
<button id="swing" class="pad" hidden>Slash<small>J</small></button>
<div id="hurt"></div>
<div id="joy" hidden><i></i></div>
<div id="sheet" class="sheet glass" hidden></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const STATS=[
  {k:'pow',name:'Power',short:'POW',drill:'Heavy bag',verb:'Hit the heavy bag'},
  {k:'grd',name:'Defense',short:'DEF',drill:'Sparring',verb:'Spar three rounds'},
  {k:'spd',name:'Footwork',short:'FTW',drill:'Jump rope',verb:'Jump rope'},
  {k:'sta',name:'Conditioning',short:'CON',drill:'Roadwork',verb:'Start roadwork'},
  {k:'foc',name:'Composure',short:'CMP',drill:'Film study',verb:'Study fight film'}
];
const BOSSES=[
  {name:'Darnell Pike',tag:'The Doorman',venue:'Club show, North Philadelphia',meta:'Age 34 · 11–9–1, 4 KO · Orthodox · Philadelphia, USA',
   lvl:3,hp:450,atk:10,spd:2.1,pattern:['strike','strike','rest'],
   moves:{strike:'Quick cut',rest:'Lowers his sword'},
   scout:'He throws one punch at a time and tires every third exchange. Block the jab, then make him pay when his hands drop.',
   quote:'Nothing personal, kid. I got rent.',
   perk:{k:'door',name:'High Guard',text:'Your stamina keeps recovering at full speed while you block.'},
   look:{skin:'#8d5a3b',hair:'#1a1412',bald:true,beard:true,shorts:'#27407d'}},
  {name:'Callum Reid',tag:'Quickstep',venue:'York Hall, Bethnal Green, London',meta:'Age 24 · 14–0, 5 KO · Southpaw · London, England',
   lvl:6,hp:900,atk:16,spd:2.7,pattern:['flurry','strike','flurry','rest'],
   moves:{strike:'Left-hand cut',flurry:'Three-cut combination',rest:'Circles out to reset'},
   scout:'None of his shots hurt much alone, but they come in threes. Keep your guard up through the whole combination before you answer.',
   quote:'You’ve come a long way to lose on points, mate.',
   perk:{k:'feet',name:'Quick Feet',text:'The first punch you land after slipping a shot does double damage.'},
   look:{skin:'#e8b796',hair:'#b5562b',shorts:'#f4ebdc'}},
  {name:'Rodrigo Salcedo',tag:'El Martillo',venue:'Arena México, Mexico City',meta:'Age 29 · 27–2, 22 KO · Orthodox · Iztapalapa, Mexico',
   lvl:10,hp:1500,atk:24,spd:2.4,pattern:['strike','heavy','rest','strike','flurry'],
   moves:{strike:'Low cut',flurry:'Low-high combination',heavy:'Overhead chop',rest:'Shakes out his arms'},
   scout:'Watch him dip. That is the overhand right loading, and blocking it will not save you. Slip it, then hit him while he recovers.',
   quote:'Aquí se pelea. Here, we fight.',
   perk:{k:'stone',name:'Counter Timing',text:'Power shots do 40% more while the opponent is loading a big punch or recovering.'},
   look:{skin:'#c68a5e',hair:'#16110f',beard:true,shorts:'#1f7a4d'}},
  {name:'Kenta Arai',tag:'The Switch',venue:'Korakuen Hall, Tokyo',meta:'Age 27 · 21–1, 12 KO · Switch-hitter · Osaka, Japan',
   lvl:14,hp:2100,atk:31,spd:2.9,pattern:['flurry','strike','heavy','flurry','rest','heavy'],
   moves:{strike:'Straight thrust',flurry:'Switch-stance combination',heavy:'Spinning cut',rest:'Steps back to reset'},
   scout:'He sets up the liver shot twice a cycle. Count them. Save your stamina for the moment he steps back.',
   quote:'I have watched your fights. All of them. It did not take long.',
   perk:{k:'wind',name:'Second Wind',text:'Once per fight, a knockout blow leaves you standing with a quarter of your health.'},
   look:{skin:'#e3b48a',hair:'#111111',shorts:'#b3202a'}},
  {name:'Isaiah Crane',tag:'The Verdict',venue:'MGM Grand Garden Arena, Las Vegas',meta:'Age 31 · 40–0, 31 KO · Orthodox · Detroit, USA',
   lvl:19,hp:2850,atk:40,spd:3.1,final:true,pattern:['strike','flurry','heavy','strike','rest','heavy','flurry','strike','rest'],
   moves:{strike:'Champion’s cut',flurry:'Title combination',heavy:'The Verdict',rest:'Plays to the crowd'},
   scout:'He has no bad habits, only patterns. Stay alive through the first half. Once you hurt him he will come at you faster and harder.',
   quote:'Forty came before you. Enjoy the walk to the ring.',
   look:{skin:'#6b4329',hair:'#120e0c',beard:true,shorts:'#c9a227'}}
];
const WALKERS=[
  {look:{skin:'#d9a57e',hair:'#5a3a22',shirt:'#3f7d6e',shorts:'#2b2b33'},a:[-40,6],b:[40,6],lines:['You fight out of Last Bell? Vega trained my uncle. He still can’t hear out of one ear.','Road’s quiet today. Good day for roadwork in the park.']},
  {look:{skin:'#7a4a2e',hair:'#111',shirt:'#c9a227',shorts:'#1d2440'},a:[6,-40],b:[6,40],lines:['I’ve got tickets for fight night. Don’t make me regret it.','Crane’s forty and oh. Somebody has to be the one.']},
  {look:{skin:'#f0c8a8',hair:'#c9c2b8',shirt:'#8a3d3d',shorts:'#3a3a3a'},a:[-6,38],b:[-6,-38],lines:['I saw Pike fight in ’09. He was slow then too. Hits hard, though.','Keep your hands up, kid. That’s the whole secret.']}
];

const SWORDS=[{n:'Wooden sword',p:0,b:0,c:0x8a6a45},{n:'Iron sword',p:60,b:.15,c:0x8f969e},{n:'Steel longsword',p:150,b:.3,c:0xcfd6de},{n:'Knight\u2019s blade',p:320,b:.5,c:0xe8f1fa},{n:'Champion\u2019s greatsword',p:600,b:.75,c:0xf2b233},
  {n:'Obsidian blade',p:1000,b:1,c:0x2a2433},{n:'Stormbreaker',p:1600,b:1.4,c:0x4fa3e0},{n:'Dragonfang',p:2600,b:1.9,c:0xd8432f},{n:'Sunforged blade',p:4200,b:2.5,c:0xffd76a},{n:'Blade of the Last Bell',p:7000,b:3.5,c:0xb98cff}];
const UPG=[
  {k:'dl',n:'Training dummies',max:10,base:40,d:l=>`Trainer: ${TRAINERS[Math.min(10,l)][0]}. Every training circle gives \u00d7${1+l*.5} progress per hit.`},
  {k:'hs',n:'Quick hands',max:8,base:60,d:l=>`You swing ${Math.round(l*15)}% faster in training circles.`},
  {k:'pc',n:'Lucky purse',max:10,base:50,d:l=>`All coins you earn are increased by ${l*25}%.`},
  {k:'vt',n:'Vitality',max:10,base:70,d:l=>`Your health in fights is increased by ${l*10}%.`},
  {k:'ar',n:'Armor',max:10,base:80,d:l=>`You take ${l*4}% less damage in fights.`},
  {k:'cr',n:'Sharp eye',max:10,base:90,d:l=>`Your critical hit chance is increased by ${l*3}%.`}];
const uCost=u=>Math.round(u.base*Math.pow((S[u.k]||0)+1,1.6)/10)*10,coinMult=()=>1+.25*(S.pc||0),critPct=()=>Math.min(70,S.stats.spd*1.5+3*(S.cr||0));
const swordCap=()=>5*(S.sword+1),swordMult=()=>1+SWORDS[S.sword].b+S.up*.04;
const ZONES=[{n:'Wooden dummy field',m:1,need:0,x:-260,z:260,c:0xc9a86a,hp:60},{n:'Iron dummy field',m:3,need:1,x:0,z:260,c:0x8f969e,hp:400},{n:'Stone dummy field',m:7,need:2,x:260,z:260,c:0x77736b,hp:1500},{n:'Champion\u2019s field',m:15,need:4,x:-260,z:-260,c:0xf2b233,hp:5000}];
const AREAS=[[0,0,30]].concat(ZONES.map(Z=>[Z.x,Z.z,14])),dummies=[];let swingT=0;
const dMult=()=>1+(S.dl||0)*.5,dCost=()=>Math.round(40*Math.pow((S.dl||0)+1,1.6)/10)*10;
/* ---------- save ---------- */
let S;
const fresh=()=>({day:1,slots:3,stats:{pow:3,grd:3,spd:3,sta:3,foc:3},beaten:0,perks:[],done:false,finish:0,met:false,coins:30,sword:0,up:0});
const save=()=>{try{localStorage.setItem('lastbell',JSON.stringify(S))}catch(e){}};
const load=()=>{try{const d=JSON.parse(localStorage.getItem('lastbell'));if(d&&d.stats)return d}catch(e){}return null};
const has=k=>S.perks.includes(k);
const hpMax=()=>Math.round((40+S.stats.sta*8)*(1+.1*(S.vt||0))), stMax=()=>100+S.stats.foc*5;

/* ---------- three setup ---------- */
const T=THREE;
let renderer;
try{renderer=new T.WebGLRenderer({canvas:$('c'),antialias:true})}catch(e){}
const scene=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,400);
const hemi=new T.HemisphereLight(0xdfeeff,0x55504a,.8),sun=new T.DirectionalLight(0xfff1d6,.9),ringLight=new T.PointLight(0xfff4e0,0,40);
scene.add(hemi,sun,sun.target,ringLight);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:120});sun.shadow.bias=-.0006;
const RX=400; // the ring lives far from town
ringLight.position.set(RX,8,0);
function mood(fightNight){
  const c=fightNight?0x0b0910:0x9cc4e4;
  scene.background=new T.Color(c);scene.fog=fightNight?new T.Fog(c,14,46):new T.Fog(c,45,150);
  hemi.intensity=fightNight?.38:.8;sun.intensity=fightNight?.3:.9;ringLight.intensity=fightNight?1.5:0;
}
const mat=(c,o)=>new T.MeshLambertMaterial(Object.assign({color:c},o));
function box(w,h,d,c,x,y,z,parent){
  const m=new T.Mesh(new T.BoxGeometry(w,h,d),c&&c.isMaterial?c:mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(parent||scene).add(m);return m;
}
function flat(w,d,c,x,y,z){const m=new T.Mesh(new T.PlaneGeometry(w,d),c&&c.isMaterial?c:mat(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m}
const solids=[];
const solid=(x,z,w,d)=>solids.push([x-w/2,x+w/2,z-d/2,z+d/2]);
const blocked=(x,z,r=.45)=>!AREAS.some(a=>Math.abs(x-a[0])<a[2]-1.3&&Math.abs(z-a[1])<a[2]-1.3)||solids.some(s=>x>s[0]-r&&x<s[1]+r&&z>s[2]-r&&z<s[3]+r);
const rnd=(a,b)=>a+Math.random()*(b-a);

function facade(base,floors,cols){
  const c=document.createElement('canvas');c.width=cols*64;c.height=floors*64;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,c.width,c.height);
  g.strokeStyle='rgba(0,0,0,.13)';for(let y=0;y<c.height;y+=8){g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke()}
  for(let f=0;f<floors;f++)for(let i=0;i<cols;i++){
    g.fillStyle=Math.random()<.14?'#e8d9a0':Math.random()<.5?'#2b3a4a':'#3d5063';g.fillRect(i*64+20,f*64+14,24,34);
    g.strokeStyle='#d8d2c6';g.lineWidth=2;g.strokeRect(i*64+20,f*64+14,24,34);g.fillStyle='#d8d2c6';g.fillRect(i*64+18,f*64+48,28,4);
  }
  return new T.MeshLambertMaterial({map:new T.CanvasTexture(c)});
}
function building(x,z,w,d,h,base){
  const fl=Math.max(1,Math.round(h/3.2)),mx=facade(base,fl,Math.max(1,Math.round(w/3.2))),mz=facade(base,fl,Math.max(1,Math.round(d/3.2))),roof=mat(0x3a3a40);
  const m=new T.Mesh(new T.BoxGeometry(w,h,d),[mz,mz,roof,roof,mx,mx]);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);solid(x,z,w,d);return m;
}
function textCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),c);return c}
function label(text,x,y,z,scale=1){
  const c=textCanvas(512,112,g=>{g.fillStyle='rgba(29,22,38,.88)';g.fillRect(0,0,512,112);g.fillStyle='#f2b233';g.fillRect(0,104,512,8);
    g.fillStyle='#f4ebdc';g.font='bold 58px "Barlow Condensed","Arial Narrow",Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text.toUpperCase(),256,54,490)});

function floater(x,y,z,text,cls){

function fightStep(dt){
  const F=fight,P=F.P,B=F.B,b=F.boss,s=S.stats;F.time+=dt;
  let dx=B.x-P.x,dz=B.z-P.z,dist=Math.hypot(dx,dz)||.01;const fx=dx/dist,fz=dz/dist,rx=-fz,rz=fx;
  const clampRing=o=>{o.x=Math.max(RX-3.2,Math.min(RX+3.2,o.x));o.z=Math.max(-3.2,Math.min(3.2,o.z))};
  // you
  P.bonus-=dt;P.hurt-=dt;
  const blocking=!P.act&&inp.block;P.block=blocking;P.moving=0;
  P.st=Math.min(P.stMax,P.st+dt*15*(blocking&&!has('door')?.3:1));
  if(P.act){
    P.t+=dt;const A=ACT[P.act];

    else if(!P.hit&&P.t>=A.at){P.hit=true;
      if(dist<1.95){
        let d=P.act==='jab'?s.pow*2+Math.random()*s.pow:s.pow*5+s.foc*1.5;
        const open=B.state==='rest'||(B.state==='recover'&&B.move==='heavy');
        if(open)d*=1.5;
        if(P.act==='power'&&has('stone')&&(open||(B.state==='wind'&&B.move==='heavy')))d*=1.4;
        if(P.bonus>0){d*=has('feet')?2:1.3;P.bonus=0}
        const crit=Math.random()*100<critPct();if(crit)d*=1.6;
        d=Math.round(d*swordMult());B.hp-=d;B.flash=.12;floater(B.x,1.9,B.z,d,crit?'crit':'');
        if(b.final&&!F.enraged&&B.hp>0&&B.hp<=b.hp/2){F.enraged=true;B.hp+=Math.round(b.hp*.12);floater(B.x,2.4,B.z,'Crane digs in','me')}
      }
    }
    if(P.t>=A.dur)P.act=null;
  }else{
    const sp=(blocking?1.5:3.1)+s.spd*.04;
    P.x+=(fx*inp.my+rx*inp.mx)*sp*dt;P.z+=(fz*inp.my+rz*inp.mx)*sp*dt;P.moving=Math.hypot(inp.mx,inp.my);
    const go=k=>{P.act=k;P.t=0;P.hit=false;P.st-=ACT[k].cost};
    if(inp.slip&&P.st>=ACT.slip.cost){go('slip');P.sdir=inp.mx<-.2?-1:1}
    else if(inp.jab&&P.st>=ACT.jab.cost)go('jab');
    else if(inp.power&&P.st>=ACT.power.cost)go('power');

  // him
  const fast=F.enraged?.82:1,tell=(B.move==='heavy'?1.15-b.lvl*.015:.62-b.lvl*.012)*fast;
  B.t+=dt;B.strike-=dt;B.flash-=dt;
  const chase=k=>{if(dist>1.5){B.x-=dx/dist*b.spd*k*dt;B.z-=dz/dist*b.spd*k*dt}};
  if(B.state==='idle'){chase(1);
    if(B.t>=B.gap&&dist<1.9){B.move=b.pattern[B.pi++%b.pattern.length];B.t=0;if(B.move==='rest')B.state='rest';else{B.state='wind';B.left=B.move==='flurry'?3:1}}}
  else if(B.state==='wind'){chase(.6);
    if(B.t>=tell){
      B.strike=.16;B.left--;
      if(dist<2.15){
        if(P.act==='slip'&&P.t<.36+s.spd*.004){P.bonus=1.6;floater(P.x,2,P.z,'Dodged','good')}
        else{
          const heavy=B.move==='heavy',raw=b.atk*(F.enraged?1.25:1)*(heavy?2.5:B.move==='flurry'?.5:1)*rnd(.92,1.08);

}
function placeFighters(t){
  const F=fight,P=F.P,B=F.B,b=F.boss,dx=B.x-P.x,dz=B.z-P.z,a=Math.atan2(dx,dz);
  meRing.position.set(P.x,0,P.z);meRing.rotation.y=a;bossModel.position.set(B.x,0,B.z);bossModel.rotation.y=a+Math.PI;
  // your pose
  const mu=meRing.userData;mu.body.rotation.set(.08,0,0);mu.body.position.y=Math.abs(Math.sin(t*6))*.03;
  arm(meRing,0,-.75,-1.75);arm(meRing,1,-.7,-1.8);
  if(P.act==='jab'){const k=Math.sin(Math.min(1,P.t/ACT.jab.dur)*Math.PI);arm(meRing,1,lerp(-.75,-1.5,k),lerp(-1.75,-.05,k))}
  else if(P.act==='power'){const u=P.t/ACT.power.dur;if(u<.55)arm(meRing,1,lerp(-.7,.5,u/.55),-1.9);else{const k=Math.sin((u-.55)/.45*Math.PI);arm(meRing,1,lerp(-.7,-1.55,k),lerp(-1.8,-.05,k))}mu.body.rotation.y=u<.55?.35*u/.55:-.3}
  else if(P.act==='slip')mu.body.rotation.z=-.45*P.sdir*Math.sin(P.t/ACT.slip.dur*Math.PI);
  else if(P.block){arm(meRing,0,-1.05,-2.15);arm(meRing,1,-1.05,-2.15);mu.body.rotation.x=.18}
  legs(meRing,t*10,P.act==='slip'?.8:(P.moving||0)*.5);
  // his pose
  const bu=bossModel.userData;bu.body.rotation.set(.08,0,0);bu.body.position.y=Math.abs(Math.sin(t*5+1))*.03;
  arm(bossModel,0,-.75,-1.75);arm(bossModel,1,-.7,-1.8);
  const heavy=B.move==='heavy';let glow=0;
  if(B.strike>0){const k=Math.sin((1-B.strike/.16)*Math.PI*.5+Math.PI*.25);const side=heavy||B.left%2===0?1:0;arm(bossModel,side,-1.5*k-.2,-.05)}
  else if(B.state==='wind'){const tell=(heavy?1.15-b.lvl*.015:.62-b.lvl*.012)*(F.enraged?.82:1),k=Math.min(1,B.t/tell);
    if(heavy){arm(bossModel,1,lerp(-.7,.9,k),-2);bu.body.rotation.x=-.2*k;bu.body.rotation.y=-.5*k;glow=k}else arm(bossModel,B.left%2?0:1,lerp(-.75,.1,k),-1.9)}
  else if(B.state==='rest'||(B.state==='recover'&&heavy)){arm(bossModel,0,.05,-.3);arm(bossModel,1,.05,-.3);bu.body.rotation.x=.3}
  if(bu.gR)bu.gR.material.emissive.setRGB(glow*.9,0,0);
  if(B.flash>0)bu.body.rotation.x=-.25;
  legs(bossModel,t*8,B.state==='idle'?.4:.1);
}
function fightCam(){
  const P=fight.P,B=fight.B,dx=B.x-P.x,dz=B.z-P.z,d=Math.hypot(dx,dz)||1,fx=dx/d,fz=dz/d,portrait=innerHeight>innerWidth,back=portrait?4.8:3.6;
  cam.position.set(P.x-fx*back*.85-fz*2.7,portrait?3.5:3,P.z-fz*back*.85+fx*2.7);cam.lookAt(P.x+(B.x-P.x)*.6,1.3,P.z+(B.z-P.z)*.6);
  sun.position.set(RX+10,30,8);sun.target.position.set(RX,0,0);
}
function fightHud(){
  const F=fight,P=F.P,B=F.B,b=F.boss;
  $('bhp').style.width=Math.max(0,B.hp/b.hp*100)+'%';$('php').style.width=Math.max(0,P.hp/P.max*100)+'%';$('pst').style.width=P.st/P.stMax*100+'%';
  const t=$('tell');let txt='',cls='';
  if(B.state==='wind'){if(B.move==='heavy'){txt=b.moves.heavy+': dodge it';cls='slip'}else{txt=b.moves[B.move]+': block';cls='block'}}
  else if(B.state==='rest'||(B.state==='recover'&&B.move==='heavy')){txt=(B.state==='rest'?b.moves.rest:'Off balance')+': hit him';cls='open'}
  else if(P.bonus>0){txt='Counter now';cls='open'}
  if(t.textContent!==txt){t.textContent=txt;t.className=cls}
  $('hurt').style.opacity=Math.max(0,P.hurt)*1.6;
  $('pad-power').style.opacity=P.st<ACT.power.cost?.45:1;$('pad-slip').style.opacity=P.st<ACT.slip.cost?.45:1;$('pad-jab').style.opacity=P.st<ACT.jab.cost?.45:1;
}
function endFight(won){
  const F=fight,b=F.boss;F.on=false;let html,final=false;
  if(won){
    S.beaten++;STATS.forEach(t=>S.stats[t.k]+=2);if(b.perk)S.perks.push(b.perk.k);const prize=Math.round(80*S.beaten*coinMult());S.coins+=prize;
    if(b.final){S.done=true;S.finish=S.day;final=true;const d=S.day,rank=d<=8?'Legend of the Last Bell':d<=13?'Undisputed champion':'Champion, the long way round';
      html=`<div class="who">Title fight · ${rank}</div><p class="big">Isaiah Crane is 40–1</p><p>You took the welterweight title at the MGM Grand in week ${d}. A finish in 8 weeks or fewer earns the Legend rank.</p><p>Coach Vega: “I told you. Somebody had to be the one.”</p>`}
    else html=`<div class="who">Won in ${Math.round(F.time)} seconds</div><p class="big">The referee waves it off</p><p>You stopped ${b.name} at ${b.venue}.</p><p><span class="gain">Every stat +2 and ${prize} coins for the sword shop.</span></p><p><span class="gain">Learned: ${b.perk.name}.</span> ${b.perk.text}</p><p>Next: ${BOSSES[S.beaten].name} at ${BOSSES[S.beaten].venue}.</p>`;
  }else{
    const near=F.B.hp<=b.hp/2,g=near?2:1,low=STATS.reduce((m,t)=>S.stats[t.k]<S.stats[m.k]?t:m,STATS[0]);S.stats[low.k]+=g;S.coins+=15;
    html=`<div class="who">Knocked out</div><p class="big">The canvas is cold</p><p>${b.name} had ${Math.round(F.B.hp/b.hp*100)}% of his health left${near?'. You had him past halfway':''}.</p><p><span class="gain">Lesson learned: ${low.name} +${g}.</span> You were paid 15 coins.</p><p>Coach Vega: “We go back to the gym. Then we ask for the rematch.”</p>`;
  }
  save();
  sheet(html,[['Back to the yard',()=>{closeSheet();fade('Last Bell Yard',()=>{
    mode='town';mood(false);fight=null;meRing.visible=false;if(bossModel){scene.remove(bossModel);bossModel=null}me.visible=true;me.position.set(0,0,-20);yaw=Math.PI;
    $('fhud').hidden=true;$('top').hidden=false;$('hurt').style.opacity=0;setMarquee();if(final){hud();save()}else useSlot()})}]]);
}

/* ---------- main loop ---------- */
let last=0,clock=0;
function resize(){if(!renderer)return;renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerHeight>innerWidth?72:60;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000||0);last=now;clock+=dt;
  if(drill&&!drill.done){const ph=((now-drill.t0)/drill.period)%2;drill.pos=ph<1?ph*100:(2-ph)*100;const m=$('mark');if(m)m.style.left=drill.pos+'%'}
  readMove();
  if(mode==='town'){if(busy){inp.mx=inp.my=0}townStep(busy?0:dt,clock)}
  else if(fight){if(fight.on&&!busy)fightStep(dt);if(fight){placeFighters(clock);fightCam();fightHud()}}
  renderer.render(scene,cam);
}
function start(data){
  S=(data&&data.stats)?data:(load()||fresh());S.coins??=30;S.sword??=0;S.up??=0;
  if(!renderer){$('sheet').hidden=false;$('sheet').innerHTML='<p class="big">3D is not available</p><p>This game needs WebGL, and this browser or device has it switched off.</p>';return}
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
  buildTown();buildZones();setTrainer();buildRing();mood(false);setMarquee();hud();resize();
  if(!S.met)intro();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
